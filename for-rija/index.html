<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf6ee">
  <meta name="description" content="A little flower, made just for Rija.">
  <title>A flower for Rija</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; --ink: #67434a; --rose: #a75b70; }
    body { margin: 0; min-height: 100svh; background: #fbf6ee; color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 43%, #f2cbd433, transparent 48%); }
    main { position: relative; min-height: 100svh; max-width: 760px; margin: auto; padding: 38px 24px 26px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .eyebrow, .footer, button { font-family: 'Avenir Next', Avenir, 'Segoe UI', sans-serif; }
    .eyebrow { margin: 0 0 18px; font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: #9b7d7d; }
    h1 { font-size: clamp(44px, 8vw, 66px); font-weight: 400; letter-spacing: -.055em; line-height: 1.1; margin: 0; }
    h1 em { color: var(--rose); font-weight: 400; }
    .intro { font-size: 17px; line-height: 1.65; color: #98777c; margin: 12px 0 0; }
    .garden { width: min(100%, 430px); margin: -5px 0 -15px; position: relative; }
    .flower { display: block; width: 100%; height: auto; overflow: visible; }
    .sway { transform-origin: 215px 472px; animation: sway 7s ease-in-out infinite; }
    .blossom { transform-origin: 215px 192px; animation: arrive 1.8s cubic-bezier(.18,.7,.25,1) both; }
    .glimmer { animation: glimmer 4s ease-in-out infinite; }
    .glimmer:nth-child(2) { animation-delay: -1.7s; }
    button { position: relative; cursor: pointer; border: 1px solid #d9a8b4; background: #fffaf5b3; color: #8e4f62; border-radius: 100px; padding: 14px 25px; font-size: 12px; letter-spacing: .055em; transition: background .2s, transform .2s; }
    button:hover { background: #f5e1e5; transform: translateY(-2px); }
    button:focus-visible { outline: 2px solid #a75b70; outline-offset: 5px; }
    .heart { margin-left: 9px; }
    .note { max-width: 360px; margin: 22px auto 0; animation: note-in .7s ease both; }
    .note[hidden] { display: none; }
    .note p { font-size: 19px; line-height: 1.65; margin: 0; }
    .note .signature { margin-top: 15px; font-size: 14px; font-style: italic; color: #a2727e; }
    .footer { margin: auto 0 0; padding-top: 30px; font-size: 10px; letter-spacing: .13em; color: #ac9493; }
    @keyframes sway { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.87); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes glimmer { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    @keyframes note-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) { main { padding-top: 30px; } .garden { width: min(100%, 350px); } .intro { font-size: 15px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little something, just for you</p>
    <h1>For you, <em>Rija.</em></h1>
    <p class="intro">Some thoughts of you turn into flowers.</p>
    <div class="garden">
      <svg class="flower" viewBox="0 0 430 500" role="img" aria-labelledby="flower-title flower-description">
        <title id="flower-title">A pink peony for Rija</title>
        <desc id="flower-description">A hand-drawn blush pink flower with many delicate petals, a curved green stem, and finely veined leaves, gently swaying among little golden stars.</desc>
        <defs>
          <linearGradient id="petal" x1="0" y1="0" x2=".7" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#fff1e9"/><stop offset=".43" stop-color="#efb6c4"/><stop offset="1" stop-color="#b95d7c"/></linearGradient>
          <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe6df"/><stop offset=".55" stop-color="#e79fb4"/><stop offset="1" stop-color="#b95176"/></linearGradient>
          <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a7b491"/><stop offset="1" stop-color="#587e67"/></linearGradient>
          <radialGradient id="halo"><stop stop-color="#e9b3bc" stop-opacity=".2"/><stop offset="1" stop-color="#f4ded8" stop-opacity="0"/></radialGradient>
          <path id="p" d="M215 203 C192 195 157 155 163 118 C166 94 185 88 196 100 C202 81 225 83 233 99 C251 88 269 105 263 126 C258 159 236 190 215 203Z"/>
          <path id="q" d="M215 196 C196 181 184 155 193 133 C198 121 208 122 214 129 C225 113 242 127 239 143 C236 165 225 182 215 196Z"/>
        </defs>
        <ellipse cx="215" cy="207" rx="181" ry="180" fill="url(#halo)"/>
        <g fill="#c7a56f" class="glimmer"><path d="M83 144 l2 7 7 2-7 2-2 7-2-7-7-2 7-2Z"/><circle cx="342" cy="242" r="2"/><circle cx="103" cy="291" r="1.6"/></g>
        <g fill="#c7a56f" class="glimmer"><path d="M333 111 l1.6 6 6 1.6-6 1.6-1.6 6-1.6-6-6-1.6 6-1.6Z"/><circle cx="121" cy="85" r="1.5"/><circle cx="312" cy="328" r="1.5"/></g>
        <g class="sway">
          <path d="M215 229 C197 289 241 354 210 470" fill="none" stroke="#718d6e" stroke-width="4" stroke-linecap="round"/>
          <path d="M223 374 C178 367 133 343 126 301 C169 296 209 322 223 374Z" fill="url(#leaf)"/>
          <path d="M224 337 C256 336 294 311 299 274 C259 275 232 301 224 337Z" fill="url(#leaf)"/>
          <g fill="none" stroke="#e0e3c5" stroke-width=".9" opacity=".62"><path d="M220 369 Q164 330 132 306 M176 339 L166 311 M190 349 L154 347 M224 335 Q269 303 295 279 M251 315 L257 289 M264 305 L287 304"/></g>
          <path d="M214 253 Q181 239 174 215 Q200 224 215 238 Q226 219 250 214 Q243 241 214 253" fill="#789574"/>
          <g class="blossom" stroke="#b86c84" stroke-width=".65" stroke-opacity=".38" stroke-linejoin="round">
            <g fill="url(#petal)">
              <use href="#p" transform="rotate(0 215 192)"/><use href="#p" transform="rotate(40 215 192)"/><use href="#p" transform="rotate(80 215 192)"/><use href="#p" transform="rotate(120 215 192)"/><use href="#p" transform="rotate(160 215 192)"/><use href="#p" transform="rotate(200 215 192)"/><use href="#p" transform="rotate(240 215 192)"/><use href="#p" transform="rotate(280 215 192)"/><use href="#p" transform="rotate(320 215 192)"/>
            </g>
            <g fill="url(#inner)" transform="translate(215 192) scale(.77) rotate(20) translate(-215 -192)">
              <use href="#p"/><use href="#p" transform="rotate(45 215 192)"/><use href="#p" transform="rotate(90 215 192)"/><use href="#p" transform="rotate(135 215 192)"/><use href="#p" transform="rotate(180 215 192)"/><use href="#p" transform="rotate(225 215 192)"/><use href="#p" transform="rotate(270 215 192)"/><use href="#p" transform="rotate(315 215 192)"/>
            </g>
            <g fill="url(#petal)" transform="translate(215 192) scale(.8) translate(-215 -192)">
              <use href="#q"/><use href="#q" transform="rotate(60 215 192)"/><use href="#q" transform="rotate(120 215 192)"/><use href="#q" transform="rotate(180 215 192)"/><use href="#q" transform="rotate(240 215 192)"/><use href="#q" transform="rotate(300 215 192)"/>
            </g>
            <g fill="#d49d55" stroke="#f8d59a" stroke-width="1.5"><ellipse cx="215" cy="190" rx="10" ry="8"/><path d="M209 188 l-3-7 M215 187 v-9 M220 188 l4-7 M208 193 l-5 3 M222 193 l5 2" fill="none" stroke-linecap="round"/></g>
          </g>
        </g>
      </svg>
    </div>
    <button id="open-note" type="button" aria-expanded="false" aria-controls="note">There's a little note for you <span class="heart" aria-hidden="true">♡</span></button>
    <div class="note" id="note" hidden>
      <p>Rija, if a thought of you could bloom,<br>I'd have a garden by now.</p>
      <p class="signature">Until then, here's one that won't fade. ♡</p>
    </div>
    <p class="footer">ONE FLOWER. ONE LITTLE SMILE. ALL YOURS.</p>
  </main>
  <script>
    const button = document.getElementById('open-note');
    const note = document.getElementById('note');
    button.addEventListener('click', () => {
      const isOpen = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', String(!isOpen));
      note.hidden = isOpen;
      button.innerHTML = isOpen ? 'There\'s a little note for you <span class="heart" aria-hidden="true">♡</span>' : 'Made with a thought of you <span class="heart" aria-hidden="true">♡</span>';
    });
  </script>
</body>
</html>
